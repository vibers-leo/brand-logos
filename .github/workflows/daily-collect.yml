name: Daily Brand SVG Collect

on:
  # 수집 스케줄은 ZeroClaw가 단일 소스로 관리한다.
  # GitHub Actions 자체 schedule과 중복되면 같은 배치가 동시에 실행될 수 있다.
  workflow_dispatch:

permissions:
  contents: write
  issues: write      # 실패 시 알림 이슈를 연다

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        # numpy 는 logoform.py(심볼 크롭·밝기 판정)가 쓴다. 2026-08-08 에
        # logoform 을 도입하면서 여기 추가를 빠뜨려 build-logo-variants 부터
        # 뒤 4단계가 5일간(8/8~8/12) 통째로 안 돌았다.
        run: pip install cairosvg Pillow requests lxml numpy boto3

      # PNG는 저장소에 없고 버킷이 원본이다. 수집·별칭 API를 오래 호출한 뒤에
      # 인증 오류를 발견하지 않도록 가장 먼저 복원한다.
      - name: 버킷에서 기존 PNG 내려받기
        run: python3 scripts/sync-png-bucket.py --pull --workers 48
        env: &ncp
          NCP_ACCESS_KEY: ${{ secrets.NCP_ACCESS_KEY }}
          NCP_SECRET_KEY: ${{ secrets.NCP_SECRET_KEY }}
          NCP_BUCKET: ${{ secrets.NCP_BUCKET }}
          NCP_ENDPOINT: ${{ secrets.NCP_ENDPOINT }}

      - name: SVG 자동 수집 + 파이프라인
        run: python3 collect-auto.py --source all --commit
        working-directory: .
        env:
          GIT_AUTHOR_NAME: "vibers-bot"
          GIT_AUTHOR_EMAIL: "vibers.leo@gmail.com"
          GIT_COMMITTER_NAME: "vibers-bot"
          GIT_COMMITTER_EMAIL: "vibers.leo@gmail.com"

      # 프리셋을 전부 돈다. 예전엔 korea 하나만 돌아서 정당·아이돌·영화사·투자사·
      # 공공기관은 **자동으로는 절대 안 들어왔다**(세션에서 수동으로만 했다).
      # 가드(파일명 대조·도메인·중복·QID충돌)를 통과한 것만 반영하고, 애매한 것은
      # wikidata-{preset}-review.json 에 남는다 — 사람이 볼 몫이다.
      - name: 위키데이터 수집 (프리셋 전체)
        run: |
          for P in korea party idol film investor public; do
            echo "── preset=$P ──"
            python3 scripts/collect-korea-wikidata.py --preset "$P" --download --apply || true
          done
        continue-on-error: true    # 외부 API 다. 실패해도 뒤 단계는 돌아야 한다

      # 한글로 못 찾는 브랜드에 별칭을 채운다. 이름·분류·웹사이트 3중 가드를
      # 통과하고 **여러 단어로 된 이름**만 자동 반영한다 (한 단어는 검수 파일로).
      - name: 한글 별칭 채우기
        run: |
          python3 scripts/fill-korean-names-wikidata.py --limit 400 || true
          python3 scripts/fill-korean-names-noweb.py --limit 400 --apply || true
        continue-on-error: true

      # 위키데이터가 가진 공식 별칭(skos:altLabel)을 QID 기준으로 가져온다.
      # QID 조회라 동음이의 위험이 없다 (KKR ← Kohlberg Kravis Roberts).
      - name: 공식 별칭 보강
        run: python3 scripts/backfill-wikidata-aliases.py || true
        continue-on-error: true

      # 대량 외부 소스는 상표·정확성 검토 전에 자동 반영하지 않는다. 미보유 후보만
      # 대기열로 남겨 수집 확장 기회를 계속 관찰한다.
      - name: 대량 신규 소스 후보 발굴
        run: |
          python3 scripts/discover-logos-apps.py
          python3 scripts/discover-thesvg.py

      # ★ 실제 수집. 2026-08-26 에 이 다섯으로 748건을 넣었는데 전부 사람이
      # 손으로 돌린 것이었고 크론엔 하나도 붙어 있지 않았다. 그래서 5시간짜리
      # 크론이 하루 4번 돌면서 실제 반영이 0~1건이었다.
      #
      # 각 수집기는 '이미 채운 브랜드는 건너뛴다' 가 내장돼 있어 매번 돌려도
      # 중복이 쌓이지 않는다. 상류(커먼즈·VLZ·gilbarbara)에 새 항목이 생기면
      # 그때 자동으로 들어온다 — 지금은 대부분 소진 상태라 평소엔 0~수십 건이다.
      #
      # ⚠️ 실패해도 파이프라인을 세우지 않는다. 외부 소스가 하나 죽었다고
      #    그날 수집 전체를 버리면 안 된다 — 어느 것이 죽었는지는 로그에 남는다.
      - name: 워드마크·형태 보완 수집
        continue-on-error: true
        timeout-minutes: 90
        run: |
          for s in svgl vlz thesvg gilbarbara commons; do
            echo "::group::collect-wordmarks-$s"
            python3 "scripts/collect-wordmarks-$s.py" || echo "⚠️ $s 실패 (계속 진행)"
            echo "::endgroup::"
          done

      # ★ 국내 수집. 2026-08-29 에 1,700건을 넣었고 그 방식을 그대로 돌린다.
      #
      # ⚠️ 기대치를 정확히 잡을 것 — 이건 '매일 수십 건'이 나오는 단계가 아니다.
      #    명단이 고정된 일회성 전수조사라 이미 다 훑었다. 실측 신규 유입은
      #    상장 연평균 106건 = **하루 0.29건**이고 지자체·대학은 더 느리다.
      #    이 단계의 값어치는 수확량이 아니라 누락 방지에 있다:
      #      · 접속 실패했던 곳 재시도 (일시적 장애가 많다 — 실측 529건)
      #      · 새로 상장·개원·개교한 곳을 놓치지 않음
      #      · 기관이 CI 를 바꿨는지 90일마다 확인 (로고 교체는 상장보다 잦다)
      #
      # 큐가 상태를 들고 있어 매번 3,500곳을 다시 훑지 않는다.
      - name: 국내 브랜드 수집 (상장사·기관·지자체)
        continue-on-error: true
        timeout-minutes: 60
        run: |
          python3 scripts/kr-collect-queue.py --build || true
          python3 scripts/kr-collect-queue.py --stats || true
          echo "::group::상장사"
          python3 scripts/collect-krx.py --workers 8 || echo "⚠️ 상장사 실패 (계속)"
          echo "::endgroup::"
          echo "::group::공공기관·대학·병원·언론사·구단·지자체"
          python3 scripts/collect-kr-institutions.py --kind all --workers 8 \
            || echo "⚠️ 기관 실패 (계속)"
          echo "::endgroup::"
          echo "::group::2차 (인라인 SVG·CSS배경·apple-touch-icon)"
          python3 scripts/collect-kr-pass2.py --workers 8 || echo "⚠️ 2차 수집 실패 (계속)"
          python3 scripts/collect-kr-pass2.py --merge || echo "⚠️ 2차 합치기 실패 (계속)"
          echo "::endgroup::"

      # SVG 만 받아온 브랜드는 logo.png 가 없어 PNG 다운로드가 404 난다.
      # build-variants 가 logo.png 를 이미 있다고 전제하기 때문이다.
      # 비트맵이 박힌 가짜 벡터도 여기서 PNG 로 내린다. (2026-08-16 사고)
      - name: logo.png 보정 + 가짜 벡터 정리
        run: python3 scripts/ensure-logo-png.py --demote-fake

      # ⚠️ 이 단계가 워크플로에 **없었다.** collect-auto.py 는 자기가 받은
      # 브랜드마다 build-variants 를 부르지만, 위키데이터 프리셋 수집기는
      # logo.svg 만 넣는다. 그래서 위키데이터로 들어온 브랜드는 logo-800·
      # transparent·white·icon 이 통째로 없었다(2026-08-18 확인: 485개 중
      # logo-800 25개 누락). CDN 에서 404 로 나타난다.
      - name: PNG 파생물 생성 (logo-800·icon·transparent·white)
        run: python3 build-variants.py

      - name: 변형 매니페스트 갱신
        run: python3 scripts/build-logo-variants.py

      - name: 밝은 로고 판정 갱신
        run: python3 scripts/scan-light-logos.py

      # 상세 페이지가 brands.json 전체(4만 개면 18MB)를 받지 않도록 브랜드별
      # 단일 파일을 만든다. Next 데이터 캐시는 2MB 초과를 저장하지 않아
      # 없으면 렌더마다 통째로 다시 받는다.
      - name: 브랜드별 brand.json 생성
        run: python3 scripts/build-brand-json.py

      - name: brands-slim 재생성
        run: python3 scripts/build-slim.py

      # slim 이 brands.json 과 어긋나면 목록에서 중복이 그대로 보이거나
      # 신규 브랜드가 안 뜬다. 실제로 variant_of 429건이 slim 에서 빠져
      # 흡수된 -icon 브랜드가 목록에 되살아난 적이 있다.
      - name: brands-slim 동기 확인
        run: python3 scripts/build-slim.py --check

      - name: 카탈로그 활용 건강도 기록
        run: python3 scripts/audit-catalog-health.py

      # 새로 만들어진 PNG 를 버킷에 올린다. 이게 빠지면 신규 브랜드의
      # PNG 다운로드가 404 다 — 저장소에도 없고 버킷에도 없기 때문이다.
      # ★ 커밋을 검증 단계보다 먼저 한다. 예전엔 맨 끝이라 그 앞의 어느
      # 단계가 실패해도 5시간치 수집이 통째로 버려졌다. 실제로 3일 연속
      # '버킷 업로드'에서, 그 뒤엔 '에셋 무결성 검사'에서 죽어 커밋이
      # 건너뛰어졌다 — 한 단계만 막는 건 반쪽짜리다.
      # 아래 검증 단계들은 저장소를 고치지 않으므로 먼저 커밋해도 안전하다.
      # collect-auto.py --commit 이 앞에서 이미 커밋하므로, 그 뒤에 생성된
      # 매니페스트·slim·variant-wanted 는 따로 커밋해야 유실되지 않는다.
      - name: 변형 산출물 커밋
        run: |
          git config user.name  "vibers-bot"
          git config user.email "vibers.leo@gmail.com"
          # _clients 를 통째로 담는다. 예전엔 파일을 하나하나 나열했는데,
          # 새 브랜드를 추가하는 수집기가 붙으면 **폴더가 커밋에서 빠져**
          # brands.json 만 올라가고 로고 파일은 CDN 에 없는 상태가 된다.
          # (_staging 은 .gitignore 로 빠지므로 통째로 담아도 안전하다)
          git add _clients 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변형 산출물 변경 없음"
            exit 0
          fi
          git commit -m "chore: 변형 매니페스트·slim 갱신 [skip ci]"
          # ⚠️ 이 잡은 5시간 돈다. 그 사이 사람이 푸시하면 push 가
          # 'fetch first' 로 거부되고 후반 산출물이 통째로 버려진다
          # (2026-08-26 실제 발생). rebase 로 따라잡고 재시도한다.
          #
          # brands.json 은 40,291개가 든 **한 줄 압축 JSON** 이라 git 이
          # 텍스트로 병합하지 못한다 — merge-brands-json.py 로 의미 병합한다.
          # 나머지 충돌 파일은 전부 재생성물이라 이쪽(러너) 것을 쓴다.
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || true
            # ⚠️ rebase 는 커밋을 **여러 개** 재적용한다. 충돌 해소를 한 번만
            #    하면 두 번째 커밋에서 또 멈춰 그대로 죽는다(2026-08-27 실제 발생).
            #    rebase 가 끝날 때까지 반복한다.
            guard=0
            while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
              guard=$((guard+1))
              if [ "$guard" -gt 20 ]; then
                echo "::error::충돌 해소가 20회를 넘었다 — 중단"
                git rebase --abort || true; exit 1
              fi
              for f in $(git diff --name-only --diff-filter=U); do
                case "$f" in
                  _clients/brands.json)
                    # 한 줄 압축 JSON 이라 텍스트 병합 불가 → 의미 병합
                    git show :2:"$f" > /tmp/base.json
                    git show :3:"$f" > /tmp/mine.json
                    python3 scripts/merge-brands-json.py /tmp/mine.json /tmp/base.json "$f" ;;
                  _clients/collect-wanted.json|_clients/svg-wanted.json)
                    # 사람이 넣은 항목이 쌓이는 목록 → 합집합. 한쪽을 고르면 유실된다
                    git show :2:"$f" > /tmp/base.json
                    git show :3:"$f" > /tmp/mine.json
                    python3 scripts/merge-wanted-json.py /tmp/mine.json /tmp/base.json "$f" ;;
                  *)
                    # 나머지는 전부 재생성물 → 러너가 방금 만든 쪽을 쓴다
                    git checkout --theirs -- "$f" 2>/dev/null || git checkout --ours -- "$f" 2>/dev/null || true ;;
                esac
                git add "$f"
              done
              if ! GIT_EDITOR=true git rebase --continue 2>&1 | tail -3; then
                if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                  echo "::error::rebase --continue 실패 (충돌 아님)"
                  git rebase --abort || true; exit 1
                fi
              fi
            done
            if git push; then
              echo "푸시 성공 (시도 $i)"; exit 0
            fi
            echo "푸시 거부 — 재시도 $i"
            sleep 5
          done
          echo "::error::3회 재시도 후에도 푸시 실패"
          exit 1

      # ⚠️ GitHub Actions runner IP 는 버킷 쓰기가 막혀 있다 (NCP 인증키의
      # 접근제한 IP 설정). 맥에서는 같은 키로 PutObject 가 된다.
      # 여기서 죽으면 5시간 돌린 수집 결과가 커밋도 안 되고 통째로 버려지므로
      # 실패해도 계속 가고, 커밋을 끝낸 뒤 마지막에 크게 터뜨린다.
      # 미업로드분은 맥에서 `python3 scripts/sync-png-bucket.py` 재실행으로 복구
      # (버킷과 로컬을 대조하므로 목록을 따로 넘길 필요가 없다).
      - name: 신규 PNG 버킷 업로드
        id: bucket_upload
        continue-on-error: true
        run: python3 scripts/sync-png-bucket.py --workers 48 --verify 20
        env: *ncp

      - name: 에셋 무결성 검사
        id: asset_check
        continue-on-error: true
        run: python3 scripts/check-assets.py

      # 업로드 실패를 여기서 터뜨린다. 커밋이 끝난 뒤라 수집 결과는 안전하다.
      # 조용히 넘기면 신규 PNG 가 CDN 에서 404 인 채로 며칠이 지난다.
      - name: 검증 결과 확인
        if: steps.bucket_upload.outcome == 'failure' || steps.asset_check.outcome == 'failure'
        run: |
          if [ "${{ steps.bucket_upload.outcome }}" = "failure" ]; then
            echo "::error::버킷 업로드 실패 — 맥에서 scripts/sync-png-bucket.py 재실행 필요"
            echo "⚠️ **버킷 업로드 실패** — 신규 PNG 가 CDN 에서 404 다." >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.asset_check.outcome }}" = "failure" ]; then
            echo "::error::에셋 무결성 검사 실패 — 위 로그의 목록 확인"
            echo "⚠️ **에셋 무결성 검사 실패** — logo.png 누락 등. 로그 참조." >> $GITHUB_STEP_SUMMARY
          fi
          echo "수집 결과는 이미 커밋됐다 — 유실 없음." >> $GITHUB_STEP_SUMMARY
          exit 1

      # 요약에 '지금 상태'를 싣는다. 총 개수만 찍으면 대기 목록이 쌓이는지
      # 줄어드는지 알 수 없어, 자동화가 헛돌고 있어도 정상처럼 보인다.
      - name: 결과 요약
        run: |
          python3 - >> $GITHUB_STEP_SUMMARY <<'PY'
          import json, glob, os
          from pathlib import Path
          B = Path("_clients")
          bs = json.loads((B / "brands.json").read_text())["brands"]
          han = lambda s: any("가" <= c <= "힣" for c in (s or ""))
          ko = [b for b in bs
                if han(b.get("name_ko")) or any(han(a) for a in (b.get("aliases") or []))]
          svg = sum(1 for b in bs if b.get("logo_svg") or b.get("has_svg"))
          print("### 수집 결과\n")
          print(f"- 브랜드 **{len(bs):,}** / 진짜 SVG {svg:,} / PNG만 {len(bs)-svg:,}")
          print(f"- 한글로 찾을 수 있는 브랜드 **{len(ko):,}** ({len(ko)/len(bs):.0%})")
          def count(name, key="brands"):
              f = B / name
              if not f.exists(): return None
              d = json.loads(f.read_text())
              return len(d.get(key) or d.get("items") or d.get("candidates") or [])
          print("\n**대기 목록** (쌓이기만 하면 자동화가 헛도는 것이다)\n")
          for label, name, key in [
              ("미보유 후보", "collect-wanted.json", "brands"),
              ("SVG 대기(보유)", "svg-wanted.json", "brands"),
              ("심볼 미수집", "variant-wanted.json", "brands"),
          ]:
              n = count(name, key)
              if n is not None: print(f"- {label}: {n:,}")
          rev = sorted(glob.glob(str(B / "wikidata-*-review.json")))
          if rev:
              print("\n**검수 대기** (사람이 볼 몫)\n")
              for f in rev:
                  d = json.loads(Path(f).read_text())
                  print(f"- {os.path.basename(f)}: {d.get('count', len(d.get('items') or []))}")
          print("\n> 공식 사이트 SVG 수집(`collect-site-svg.mjs`)은 자동화하지 않는다 —")
          print("> 메뉴 아이콘·다른 회사 배너를 잡는 일이 잦아 눈검사가 필요하다.")
          PY

      # 조용한 실패를 막는다.
      # 2026-08-08 에 numpy 를 빠뜨려 5일간 매일 실패했는데 아무도 몰랐다.
      # 커밋 로그에는 "로고 자동수집 YYYY-MM-DD" 가 계속 찍혀서 겉으로는
      # 정상으로 보였다(수집 단계는 성공하고 그 뒤에서 죽었기 때문).
      # 실패하면 이슈를 열어 GitHub 알림이 오게 한다. 새 시크릿이 필요 없다.
      - name: 실패 알림
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `자동수집 실패 — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `[실행 로그](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '수집 단계는 성공하고 뒤 단계에서 죽는 경우가 있다.',
              '커밋이 찍혔다고 정상이라고 판단하지 말 것.',
            ].join('\n');
            // 같은 제목의 열린 이슈가 있으면 중복 생성하지 않는다
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'collect-failure', per_page: 20,
            });
            if (open.some(i => i.title === title)) return;
            await github.rest.issues.create({
              ...context.repo, title, body, labels: ['collect-failure'],
            });
