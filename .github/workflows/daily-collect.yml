name: Daily Brand SVG Collect

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 KST 06:00 (UTC 21:00 전날)
  workflow_dispatch:         # 수동 실행 허용

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install cairosvg Pillow requests lxml

      - name: SVG 자동 수집 + 파이프라인
        run: python3 collect-auto.py --source all --commit
        working-directory: .
        env:
          GIT_AUTHOR_NAME: "vibers-bot"
          GIT_AUTHOR_EMAIL: "vibers.leo@gmail.com"
          GIT_COMMITTER_NAME: "vibers-bot"
          GIT_COMMITTER_EMAIL: "vibers.leo@gmail.com"

      - name: 변형 매니페스트 갱신
        run: python3 scripts/build-logo-variants.py

      - name: 밝은 로고 판정 갱신
        run: python3 scripts/scan-light-logos.py

      - name: brands-slim 재생성
        run: python3 scripts/build-slim.py

      - name: 에셋 무결성 검사
        run: python3 scripts/check-assets.py

      # collect-auto.py --commit 이 앞에서 이미 커밋하므로, 그 뒤에 생성된
      # 매니페스트·slim·variant-wanted 는 따로 커밋해야 유실되지 않는다.
      - name: 변형 산출물 커밋
        run: |
          git config user.name  "vibers-bot"
          git config user.email "vibers.leo@gmail.com"
          git add _clients/*/variants.json _clients/*/variants \
                  _clients/variants-index.json _clients/brands-slim.json \
                  _clients/brands.json _clients/variant-wanted.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변형 산출물 변경 없음"
          else
            git commit -m "chore: 변형 매니페스트·slim 갱신 [skip ci]"
            git push
          fi

      - name: 결과 요약
        run: |
          echo "### 수집 결과" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          with open('_clients/brands.json') as f:
              raw = json.load(f)
          brands = raw['brands']
          print(f'총 {len(brands)}개 브랜드 수록')
          " >> $GITHUB_STEP_SUMMARY
