<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 255" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="specular" filterUnits="userSpaceOnUse">
      <!-- blur the black alpha channel -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6" result="blur" />

      <!-- offset the blur to get the drop shadow... -->
      <feOffset in="blur" dx="2" dy="2" result="dropShadow" />

      <!-- use the blur as a bump map; could adjust the direction... -->
      <feSpecularLighting in="blur"
        surfaceScale="5"
        specularConstant=".85"
        specularExponent="20"
        lighting-color="#eee"
        result="specular">
        <fePointLight x="-5000" y="-10000" z="8000" />
      </feSpecularLighting>

      <!-- clip the specular lighting to the SourceAlpha size -->
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="specularTrimmed" />

      <!-- add the trimmed specular highlights to the SourceGraphic -->
      <!-- calculation is result = k1*i1*i2 + k2*i1 + k3*i2 + k4, so this is a just a simple add -->
      <feComposite in="SourceGraphic" in2="specularTrimmed"
        operator="arithmetic"
        k1="0" k2="1" k3="1" k4="0"
        result="highlight" />

      <!-- merge dropShadow and highlighted source graphic -->
      <feMerge>
        <feMergeNode in="dropShadow" />
        <feMergeNode in="highlight" />
      </feMerge>
    </filter>
  </defs>
  
