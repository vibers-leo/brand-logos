            <stop offset="100%" stop-color="rgba(0,53,146,0.85)" />
          </linearGradient>
          <linearGradient id="trail-grad-out-orange" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
