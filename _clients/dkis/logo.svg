<svg xmlns="http://www.w3.org/2000/svg" class="orb-svg" id="orb-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <defs>
          <linearGradient id="trail-grad-orange" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
