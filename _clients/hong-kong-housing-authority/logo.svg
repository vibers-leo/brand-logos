<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" 
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="300" height="300" viewBox="-10 -10 20 20" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1">
  <desc>Logo of Hong Kong Housing Authority</desc>
  <g stroke="red" stroke-width="2">
    <rect x="-6" y="-6" width="12" height="12" fill="none" />
    <g id="g3">
      <g id="g2">
        <line id="g1" x1="2" y1="9" x2="2" y2="3" />
        <use xlink:href="#g1" transform="translate(-4,0)" />
      </g>
      <use xlink:href="#g2" transform="rotate(90)" />
    </g>
    <use xlink:href="#g3" transform="rotate(180)" />
  </g>
</svg>