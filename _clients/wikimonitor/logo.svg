<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#mainGradient)" filter="url(#dropShadow)" />

  <path d="M256 100 C 180 100, 120 120, 120 180 V 280 C 120 380, 256 440, 256 440 C 256 440, 392 380, 392 280 V 180 C 392 120, 332 100, 256 100 Z" 
        fill="#ffffff" fill-opacity="0.15" />

  <g transform="translate(0, 20)" fill="none" stroke="#ffffff" stroke-width="35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 220 L 200 320 L 256 200 L 312 320 L 362 220" />
    
    <circle cx="256" cy="200" r="10" fill="#ffffff" stroke="none" />
  </g>

  <circle cx="360" cy="150" r="25" stroke="#ffffff" stroke-width="8" fill="none" opacity="0.8" />
  <line x1="378" y1="168" x2="395" y2="185" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8" />

</svg>
